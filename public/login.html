<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveChat · Iniciar sesión</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="aero-bg" id="aeroBg" aria-hidden="true"></div>
  <main class="auth-card">
    <div class="brand brand--big"><span class="brand-logo">🎧</span> WaveChat</div>
    <p class="auth-sub">Conversa en tiempo real con tu equipo.</p>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" id="tabLogin" role="tab" aria-selected="true">Iniciar sesión</button>
      <button type="button" class="tab" id="tabRegister" role="tab" aria-selected="false">Crear cuenta</button>
    </div>

    <form id="authForm" class="auth-form" autocomplete="on" novalidate>
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" maxlength="20" autocomplete="username" placeholder="tu_usuario" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" maxlength="72" autocomplete="current-password" placeholder="Mínimo 8 caracteres" required>

      <div id="confirmWrap" hidden>
        <label for="confirm">Repite la contraseña</label>
        <input id="confirm" name="confirm" type="password" maxlength="72" autocomplete="new-password" placeholder="Repite la contraseña">
      </div>

      <div id="authError" class="form-error" role="alert" hidden></div>
      <button type="submit" id="submitBtn" class="btn-primary">Entrar</button>
    </form>

    <button id="themeBtn" class="icon-btn auth-theme" type="button" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>
  </main>
  <p class="photo-credit">Fotos: Chris Barbalis y Tyler Lastovich · <a href="https://unsplash.com/license" target="_blank" rel="noopener">Unsplash</a></p>
  <script src="aero.js"></script>
  <script src="auth.js"></script>
</body>
</html>
